:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {

  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);

.btn:is(.btn-block, .viz-tile) {

}

  overflow-wrap: anywhere;

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  color: var(--muted-foreground);

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;

.nav-pills .nav-link.active {

.viz-carousel:has(&gt; .viz-carousel-controls) {

          &lt;section class=&quot;fs-hero fs-wrap&quot;&gt;&lt;div class=&quot;fs-hero-copy&quot;&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;Berkeley · San Rafael · Online&lt;/span&gt;&lt;h1&gt;Therapy That Fits&lt;br&gt;&lt;em class=&quot;fs-emphasis&quot;&gt;Real Life.&lt;/em&gt;&lt;/h1&gt;&lt;p class=&quot;fs-lede&quot;&gt;Adult therapy with licensed clinicians. Meet in Berkeley, San Rafael, or by video. Most insurance accepted.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;fs-action cursor-interaction&quot; data-to-form&gt;Schedule Consultation&lt;/button&gt;&lt;div class=&quot;fs-hero-note&quot;&gt;One request. Personal follow-up from our intake team.&lt;/div&gt;&lt;div class=&quot;fs-hero-rings&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

on&gt;&lt;/figure&gt;&lt;div&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;Clinician-Owned. People-Focused.&lt;/span&gt;&lt;h2&gt;Real People.&lt;br&gt;&lt;em&gt;Real Places.&lt;/em&gt;&lt;/h2&gt;&lt;p&gt;Care begins with a conversation. Our intake coordinator checks insurance, discusses availability, and helps find a therapist match.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;fs-text-button cursor-interaction&quot; data-to-form=&quot;&quot;&gt;Schedule Consultation&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;fs-section fs-wrap fs-process-list&quot;&gt;&lt;div&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;A clear path to care&lt;/span&gt;&lt;h2&gt;One Request.&lt;br&gt;Personal Follow-up.&lt;/h2&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;fs-step&quot;&gt;&lt;span class=&quot;fs-step-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Complete the Intake Form&lt;/h3&gt;&lt;p&gt;Send the details needed to start a request.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fs-step&quot;&gt;&lt;span class=&quot;fs-step-number&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Discuss Insurance and Fit&lt;/h3&gt;&lt;p&gt;Our coordinator checks coverage and therapist availability.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fs-step&quot;&gt;&lt;span class=&quot;fs-step-number&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Schedule the First Session&lt;/h3&gt;&lt;p&gt;Meet in the office or by video, depending on the match.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
          &lt;section class=&quot;fs-section fs-wrap fs-insurance&quot;&gt;&lt;div&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;Most insurance accepted&lt;/span&gt;&lt;h2&gt;Coverage Questions?&lt;br&gt;Intake Can Help.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;fs-insurance-detail&quot;&gt;&lt;p&gt;Family Spring is an insurance-based practice. Intake checks plan benefits and discusses expected costs before a first session is booked.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;

          &lt;section class=&quot;fs-section fs-wrap fs-team&quot;&gt;&lt;div class=&quot;fs-section-intro&quot;&gt;&lt;div&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;Therapist matching&lt;/span&gt;&lt;h2&gt;Care Starts with the Right Fit.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Our coordinator helps connect each request with a therapist and current openings.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;fs-three&quot;&gt;&lt;div class=&quot;fs-clinician&quot;&gt;&lt;div class=&quot;fs-portrait&quot;&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Therapist Name&lt;/h3&gt;&lt;p&gt;Credential · approved focus&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fs-clinician&quot;&gt;&lt;div class=&quot;fs-portrait&quot;&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Therapist Name&lt;/h3&gt;&lt;p&gt;Credential · approved focus&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fs-clinician&quot;&gt;&lt;div class=&quot;fs-portrait&quot;&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Therapist Name&lt;/h3&gt;&lt;p&gt;Credential · approved focus&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;fs-supporting&quot;&gt;Clinician placeholders. Final names, credentials, and photo permissions to be verified.&lt;/p&gt;&lt;/section&gt;
          &lt;section class=&quot;fs-section fs-wrap fs-faq&quot;&gt;&lt;div class=&quot;fs-section-intro&quot;&gt;&lt;h2&gt;Before Getting Started.&lt;/h2&gt;&lt;/div&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;How much will a session cost?&lt;/summary&gt;&lt;p&gt;Costs depend on insurance benefits and the plan. Intake will check coverage and discuss expected costs.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;How soon can sessions begin?&lt;/summary&gt;&lt;p&gt;Availability varies. The intake coordinator will discuss current openings and next steps.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Are evening sessions available?&lt;/summary&gt;&lt;p&gt;Share scheduling preferences in the intake process. The coordinator will check available options.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Can I meet a therapist online?&lt;/summary&gt;&lt;p&gt;Yes. Video sessions are available for people located in California.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;What if my plan isn&#x27;t accepted?&lt;/summary&gt;&lt;p&gt;Intake will confirm whether Family Spring can work with the plan and explain the available next steps.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;
          &lt;section class=&quot;fs-end&quot;&gt;&lt;h2&gt;Take the Next Step.&lt;/h2&gt;&lt;p&gt;Send a request to discuss coverage, availability, and a therapist match.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;fs-action cursor-interaction&quot; data-to-form&gt;Schedule Consultation&lt;/button&gt;&lt;span class=&quot;fs-brand-motif&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/section&gt;
        &lt;/main&gt;
        &lt;main class=&quot;fs-confirmation&quot; hidden&gt;&lt;section class=&quot;fs-thanks&quot;&gt;&lt;span class=&quot;fs-thanks-icon&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;Request received&lt;/span&gt;&lt;h1&gt;Thank You.&lt;br&gt;&lt;em&gt;Request Received.&lt;/em&gt;&lt;/h1&gt;&lt;p&gt;Our intake coordinator will follow up to check insurance, discuss therapist availability, and explain the next step.&lt;/p&gt;&lt;p&gt;This confirms the request. An appointment has not been booked yet.&lt;/p&gt;&lt;div class=&quot;fs-ready&quot;&gt;&lt;h3&gt;What Happens Next&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Intake reaches out to discuss the request.&lt;/li&gt;&lt;li&gt;Have an insurance card and scheduling preferences ready.&lt;/li&gt;&lt;li&gt;Intake helps arrange a first session when a match is available.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;fs-text-button cursor-interaction&quot; data-show-landing&gt;Back to Landing Page Preview&lt;/button&gt;&lt;/section&gt;&lt;/main&gt;

          &lt;section class=&quot;fs-section fs-wrap&quot;&gt;&lt;div class=&quot;fs-section-intro&quot;&gt;&lt;div&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;How it works&lt;/span&gt;&lt;h2&gt;A Little Clarity&lt;br&gt;On What Comes Next.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fs-three&quot;&gt;

            &lt;div class=&quot;fs-step&quot;&gt;&lt;span class=&quot;fs-step-number&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Talk with Intake&lt;/h3&gt;&lt;p&gt;Our coordinator checks insurance and helps find a therapist match.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;fs-step&quot;&gt;&lt;span class=&quot;fs-step-number&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Begin Sessions&lt;/h3&gt;&lt;p&gt;Meet in Berkeley, San Rafael, or by video in California.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

          &lt;section class=&quot;fs-section fs-wrap fs-help&quot;&gt;&lt;div class=&quot;fs-section-intro&quot;&gt;&lt;div&gt;&lt;span class=&quot;fs-eyebrow&quot;&gt;Support for adults&lt;/span&gt;&lt;h2&gt;Space for What Matters.&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fs-three&quot;&gt;
            &lt;div class=&quot;fs-help-item&quot;&gt;&lt;h3&gt;Anxiety&lt;/h3&gt;&lt;p&gt;Therapy for worry, stress, and feeling overwhelmed.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;fs-help-item&quot;&gt;&lt;h3&gt;Depression&lt;/h3&gt;&lt;p&gt;Support for low mood and the challenges of daily life.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;fs-help-item&quot;&gt;&lt;h3&gt;Trauma &amp;amp; PTSD&lt;/h3&gt;&lt;p&gt;Trauma-focused therapy with a licensed clinician.&lt;/p&gt;&lt;/div&gt;
          &lt;/div&gt;&lt;p class=&quot;fs-supporting&quot;&gt;Support also includes relationship concerns and everyday stress.&lt;/p&gt;&lt;/section&gt;
